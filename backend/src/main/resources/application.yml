server:
  port: 8080

spring:
  application:
    name: simtrade-backend
  datasource:
    url: jdbc:mysql://localhost:3306/simtrade?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Hong_Kong
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 第三方行情 AOB 接口配置
aob:
  host: http://api.aob.example.com
  mq:
    quote-queue: market.data.queue
  subscription:
    enabled: false
    exchange: subscribe.exchange
    routing-key: subscribe.key
    asset-ids: 00700.HK,02800.HK,0388.HK,2800.HK
    command-code: 1
    market-type-hk: 1
    quote-level-lv2: 2
    type: 0

app:
  cors:
    allowed-origin-patterns: https://*.vercel.app,https://*.cpolar.cn,https://*.cpolar.com,https://*.cpolar.top,https://*.cpolar.io,http://localhost:*,http://127.0.0.1:*,http://99.17.119.184:*,http://10.47.149.92:*
  avatar:
    upload-dir: uploads/avatars
  ledger:
    db-strict-mode: ${APP_LEDGER_DB_STRICT_MODE:false}
  user-profile:
    db-strict-mode: ${APP_USER_PROFILE_DB_STRICT_MODE:false}
  order:
    redis-strict-mode: ${APP_ORDER_REDIS_STRICT_MODE:false}

trading:
  hk-holidays: 2026-01-01,2026-02-17,2026-02-18,2026-04-03,2026-04-06,2026-05-01,2026-07-01,2026-10-01,2026-12-25
