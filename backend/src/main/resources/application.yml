server:
  port: 8080

spring:
  application:
    name: simtrade-backend
  datasource:
    url: jdbc:mysql://localhost:3306/simtrade?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Hong_Kong
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 第三方行情 AOB 接口配置
aob:
  host: http://api.aob.example.com
