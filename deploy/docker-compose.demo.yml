services:
  mysql:
    image: mysql:8.4
    container_name: simtrade-demo-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-simtrade}
      MYSQL_USER: ${MYSQL_USER:-simtrade}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-simtrade123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init-demo.sql:/docker-entrypoint-initdb.d/01-init-demo.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: simtrade-demo-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: simtrade-demo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: simtrade-demo-backend
    env_file:
      - ./env/backend.demo.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-simtrade}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Hong_Kong
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-simtrade}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-simtrade123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
      APP_AVATAR_UPLOAD_DIR: /data/simtrade/avatars
    volumes:
      - avatar_data:/data/simtrade/avatars
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: simtrade-demo-frontend
    environment:
      PORT: 3000
    depends_on:
      - backend
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: simtrade-demo-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  avatar_data:
